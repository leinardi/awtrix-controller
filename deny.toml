# cargo-deny: the dependency gate for the Rust workspace. `cargo deny check` runs every section;
# `make audit-deps` runs the advisories section on its own, since it is the one that needs the
# network to be current.

[graph]
all-features = true

[advisories]
# Every vulnerability and unsound advisory fails; "unmaintained" fails for direct and transitive
# crates alike unless listed below with a reason.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # Unmaintained, pulled in transitively by rmqtt (the embedded broker) and not replaceable from
    # here. No vulnerability is reported against either; revisit on every rmqtt upgrade.
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained, transitive via rmqtt; no known vulnerability" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained, transitive via rmqtt; no known vulnerability" },
    # Unmaintained, the parser under serde_yaml_ng, which reads only the operator's own
    # configuration file, once at startup. No vulnerability is reported against it; serde-saphyr
    # is the safe-Rust way out if that changes.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, transitive via serde_yaml_ng; parses only the local config file; no known vulnerability" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots: the Mozilla root certificates bundled into the binary (ureq, rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # systemstat (rmqtt's system statistics) is public-domain-equivalent; allowed for that crate
    # only, so another Unlicense-only crate still needs a decision.
    { allow = ["Unlicense"], crate = "systemstat" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
