# cargo-deny: the dependency gate for the Rust workspace. `cargo deny check` runs every section;
# `make audit-deps` runs the advisories section on its own, since it is the one that needs the
# network to be current.

[graph]
all-features = true

[advisories]
# Every vulnerability and unsound advisory fails; "unmaintained" fails for direct and transitive
# crates alike unless listed below with a reason.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # Unmaintained, pulled in transitively by rmqtt (the embedded broker) and not replaceable from
    # here. No vulnerability is reported against either; revisit on every rmqtt upgrade.
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained, transitive via rmqtt; no known vulnerability" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained, transitive via rmqtt; no known vulnerability" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
