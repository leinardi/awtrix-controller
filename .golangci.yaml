version: "2"

linters:
  default: all

  enable:
    - gomodguard_v2

  disable:
    - gomodguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - nonamedreturns
    - wsl

  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        logger:
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: logging is allowed only via internal/logger (logger.L).
          files:
            # logrus is allowed to use only in the logger package.
            - "!**/internal/logger/**.go"
        forbidden-forks:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: Should be replaced by standard lib errors package.
            - pkg: "github.com/instana/testify"
              desc: It's a fork of github.com/stretchr/testify.
    dupl:
      threshold: 100
    funlen:
      lines: -1 # the number of lines (code + empty lines) is not a right metric and leads to code without empty line or one-liner.
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
    gocognit:
      min-complexity: 35
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    mnd:
      # don't include the "operation" and "assign"
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    govet:
      enable:
        - nilness
        - shadow
    errorlint:
      asserts: false
    lll:
      line-length: 140
    misspell:
      locale: US
      ignore-rules:
        - "importas" # linter name
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: true # require an explanation for nolint directives
      require-specific: true # require nolint directives to be specific about which linter is being skipped
    revive:
      rules:
        - name: indent-error-flow
        - name: unexported-return
          disabled: true
        - name: unused-parameter
        - name: unused-receiver

  exclusions:
    generated: lax # skip files containing "Code generated" magic comment
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: (.+)_test\.go
        linters:
          - dupl
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - lll
          - maintidx
          - mnd
          - paralleltest
          - testpackage
          - varnamelen
      - path: (.+)_test\.go
        linters:
          - cyclop
        text: "calculated cyclomatic complexity"
      - path: (.+)_test\.go
        linters:
          - errcheck
        text: "CloseNow"
      - path: (.+)_test\.go
        linters:
          - gosec
        text: "G101: Potential hardcoded credentials"
      # Logger tests mutate the global logger singleton via Set(); running them
      # in parallel would cause non-deterministic test failures.
      - path: internal/logger/logger_test\.go
        linters:
          - paralleltest
      # Config YAML keys intentionally use snake_case to match the conventional
      # YAML style (energy_saving, new_year, ws_port, calendar_accent, etc.).
      # The tagliatelle linter expects camelCase for YAML tags, which is wrong here.
      - path: internal/config/config\.go
        linters:
          - tagliatelle
      # The config package legitimately stores MQTT credentials read from the
      # user's config file. gosec G117 (secret in exported field) is a false
      # positive here — the field is not a hardcoded credential.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: "G117"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/leinardi/awtrix-controller)
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/leinardi/awtrix-controller
