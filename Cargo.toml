[workspace]
members = [".", "meta"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/awtrix-controller"

# The crates shared with the other Rust services, from leinardi/rust-common: a git dependency
# pinned by release tag (`tag`), with `version` the tag's `<major>.<minor>`; `version` keeps
# cargo-deny's `wildcards = "deny"` satisfied and makes cargo refuse a checkout of another version.
# Moving the pin: change the `tag` on every line (and `version`, when the tag's `<major>.<minor>`
# moves: cargo refuses a v0.4.0 checkout against `version = "0.3"`), run `cargo fetch` (not
# `cargo update -p`); `git diff Cargo.lock` must touch only rust-common lines (AGENTS.md, "Shared
# crates"). Each member opts in with `<name>.workspace = true` and its own features. Local work on
# both repositories: an uncommitted `[patch."https://github.com/leinardi/rust-common"]` table
# naming each crate with `path = "../rust-common/crates/<name>"`, never in a release or image build
# (the image's build context does not hold them).
[workspace.dependencies]
go-clock = { git = "https://github.com/leinardi/rust-common", tag = "v0.3.0", version = "0.3" }
repo-meta = { git = "https://github.com/leinardi/rust-common", tag = "v0.3.0", version = "0.3" }
service-kit = { git = "https://github.com/leinardi/rust-common", tag = "v0.3.0", version = "0.3" }
testenv-core = { git = "https://github.com/leinardi/rust-common", tag = "v0.3.0", version = "0.3" }
tracing-setup = { git = "https://github.com/leinardi/rust-common", tag = "v0.3.0", version = "0.3" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and the meta crate asserts that each one does), and every clippy run is
# workspace-wide.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory. Every one is counted by scripts/check-suppressions.sh.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through the logger, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; the allow-list is in clippy.toml.
min_ident_chars = "deny"
# The wall-clock ban in clippy.toml is only enforced if the lint is.
disallowed_methods = "deny"

[package]
name = "awtrix-controller"
version = "0.0.0"
description = "MQTT broker and automation controller for Awtrix3 LED matrix clocks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures = "0.3.34"
# The injected wall clock (Clock, SystemClock, TokioClock, the tests' FakeClock), re-exported by
# src/clock (rust-common).
go-clock.workspace = true
jiff = { version = "0.2.38", features = ["tzdb-bundle-always", "serde"] }
rmqtt = { version = "0.24.0", default-features = false, features = ["ws", "plugin", "retain"] }
rmqtt-retainer = { version = "0.24.0", features = ["ram"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
serde_yaml_ng = "0.10"
# The build stamps (buildinfo!), and the runtime: its builder and the bound on its shutdown
# (build_runtime, run_until_exit, Exit) (rust-common).
service-kit = { workspace = true, features = ["runtime"] }
sunrise = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
# The logger's subscriber: tracing-subscriber's text or flat JSON, no ANSI, UTC timestamps, with
# the `log` facade bridged in for rmqtt (rust-common); the level and format are resolved here.
tracing-setup = { workspace = true, features = ["log-bridge"] }
# MakeWriter, the bound of the logger's writer.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Line tables only for the workspace and no debug info for the dependencies: backtraces keep
# their files and lines, and the debug and test binaries shrink to a fraction of their size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The meta-tests scan the tree with regexes; unoptimised, regex compilation and matching dominate
# their run time. Only the regex crates are optimised in dev and test builds, which costs a few
# seconds on a clean build and nothing on an incremental one; the workspace's own code stays at
# opt-level 0 for debugging.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[dev-dependencies]
log = "0.4.34"
rumqttc = { version = "0.25.1", default-features = false, features = ["websocket"] }
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time"] }
tokio-tungstenite = "0.30.0"
# Capture and set_default, what the unit tests log into.
tracing-setup = { workspace = true, features = ["testing"] }
